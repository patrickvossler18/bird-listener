services:
  birdnet-go:
    # Pinned to a dated upstream release, NOT :nightly/:latest (which are the
    # same moving, unreviewed build). Immutable, so it never changes under us.
    # Bump deliberately: check github.com/tphakala/birdnet-go/releases, edit
    # this tag, then `docker compose up -d`. docker-update.sh reports when a
    # newer release exists.
    image: ghcr.io/tphakala/birdnet-go:20260716
    container_name: birdnet-go
    restart: unless-stopped
    # Needs the host audio device. Adjust the device path to your USB sound card
    # (check `arecord -l`; often card 1 -> /dev/snd is enough with this mapping).
    devices:
      - /dev/snd:/dev/snd
    ports:
      # Loopback-only. The UI serves the config, system info, detection history
      # and our latitude/longitude to any unauthenticated LAN client, and
      # upstream's basicauth is an OAuth2 flow wanting a domain + HTTPS (a poor
      # fit for a bare LAN IP). So don't publish it; tunnel instead:
      #     ssh -L 8080:localhost:8080 birdpi   -> http://localhost:8080
      - "127.0.0.1:8080:8080"
    volumes:
      - ./birdnet-go/config:/config
      - ./birdnet-go/data:/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"          # MQTT (subscribed to by the wall node)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data:/mosquitto/data
