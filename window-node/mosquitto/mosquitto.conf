listener 1883 0.0.0.0
# Authenticated. The broker is reachable from the whole LAN, and anything that
# can publish to birdnet/detection controls what the wall node displays.
# The password file is generated, not committed -- see window-node/README.md.
# To add or rotate a user:
#   docker exec -it mosquitto mosquitto_passwd -b /mosquitto/config/passwd birds NEWPASS
#   docker compose restart mosquitto
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
