listener 1883 0.0.0.0
# Open on the LAN so the wall node can subscribe. This is fine for a trusted
# home network. To require auth instead, set `allow_anonymous false` and add a
# password file:
#   docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd birds
#   password_file /mosquitto/config/passwd
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
